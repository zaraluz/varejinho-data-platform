table: varejinho.silver.pagarfornecedorparcela
owner: zara.louise
description: Parcelas de pagamento a fornecedores
sla_freshness_hours: 24
grain: [id]

columns:
  - {name: id,                    type: bigint,       nullable: false, unique: true}
  - {name: id_pagarfornecedor,    type: bigint,       nullable: false}
  - {name: numeroparcela,         type: int,          nullable: false}
  - {name: datavencimento,        type: timestamp,    nullable: false}
  - {name: valor,                 type: decimal(14,2),nullable: false, min: 0}

quality_rules:
  - {rule: no_duplicates,  key: [id],        severity: error}
  - {rule: not_null,       columns: [id, id_pagarfornecedor, datavencimento, valor], severity: error}