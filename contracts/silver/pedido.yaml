table: pedido
owner: zara.louise
description: Pedidos de compra com status de entrega
sla_freshness_hours: 8
grain:
  - id

columns:
  - name: id
    type: string
    nullable: false
    unique: true
  - name: id_fornecedor
    type: string
    nullable: false
  - name: id_loja
    type: string
    nullable: false
  - name: datacompra
    type: timestamp
    nullable: false
  - name: id_situacaopedido
    type: string
    nullable: false

quality_rules:
  - rule: no_duplicates
    key: [id]
    severity: error
  - rule: not_null
    columns: [id, id_fornecedor, id_loja, datacompra]
    severity: error
  - rule: referential_integrity
    column: id_fornecedor
    references: fornecedor.id
    severity: warning
  - rule: referential_integrity
    column: id_loja
    references: loja.id
    severity: warning
