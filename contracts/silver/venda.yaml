table: venda
owner: zara.louise
description: Transacoes de venda no PDV, deduplicadas e tipadas
sla_freshness_hours: 8
grain:
  - id

columns:
  - name: id
    type: string
    nullable: false
    unique: true
  - name: data
    type: timestamp
    nullable: false
  - name: id_loja
    type: string
    nullable: false
  - name: id_produto
    type: string
    nullable: false
  - name: valor_total
    type: "decimal(14,2)"
    nullable: false
    min: 0
  - name: quantidade
    type: "decimal(14,3)"
    nullable: false

quality_rules:
  - rule: no_duplicates
    key: [id]
    severity: error
  - rule: not_null
    columns: [id, data, id_loja, id_produto, valor_total]
    severity: error
  - rule: referential_integrity
    column: id_loja
    references: loja.id
    severity: warning
  - rule: referential_integrity
    column: id_produto
    references: produto.id
    severity: warning
  - rule: freshness
    column: data
    max_age_hours: 24
    severity: warning
