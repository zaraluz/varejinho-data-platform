table: varejinho.silver.pagaroutrasdespesasimposto
owner: zara.louise
description: Impostos vinculados a outras despesas
sla_freshness_hours: 24
grain: [id]

columns:
  - {name: id,                      type: bigint,        nullable: false, unique: true}
  - {name: id_pagaroutrasdespesas,  type: bigint,        nullable: false}
  - {name: valor,                   type: decimal(14,2), nullable: false, min: 0}
  - {name: datavencimento,          type: timestamp,     nullable: false}
  - {name: basecalculo,             type: decimal(14,2), nullable: true}
  - {name: aliquota,                type: decimal(8,4),  nullable: true}

quality_rules:
  - {rule: no_duplicates,  key: [id],                         severity: error}
  - {rule: not_null,       columns: [id, id_pagaroutrasdespesas, valor, datavencimento], severity: error}