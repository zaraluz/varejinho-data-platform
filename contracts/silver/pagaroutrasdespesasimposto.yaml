table: pagaroutrasdespesasimposto
owner: zara.louise
description: Impostos vinculados a outras despesas
sla_freshness_hours: 24
grain:
  - id

columns:
  - name: id
    type: string
    nullable: false
    unique: true
  - name: id_pagaroutrasdespesas
    type: string
    nullable: false
  - name: valor
    type: "decimal(14,3)"
    nullable: false
    min: 0
  - name: datavencimento
    type: timestamp
    nullable: true
  - name: basecalculo
    type: "decimal(14,3)"
    nullable: true
  - name: aliquota
    type: "decimal(14,3)"
    nullable: true

quality_rules:
  - rule: no_duplicates
    key: [id]
    severity: error
  - rule: not_null
    columns: [id, id_pagaroutrasdespesas, valor]
    severity: error
