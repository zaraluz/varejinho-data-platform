table: perda
owner: zara.louise
description: Registros de perdas e quebras por produto e loja
sla_freshness_hours: 24
grain:
  - id

columns:
  - name: id
    type: string
    nullable: false
    unique: true
  - name: id_produto
    type: string
    nullable: false
  - name: id_loja
    type: string
    nullable: false
  - name: data
    type: timestamp
    nullable: false
  - name: quantidade
    type: "decimal(14,3)"
    nullable: false
    min: 0
  - name: id_tipomotivoperda
    type: string
    nullable: false

quality_rules:
  - rule: no_duplicates
    key: [id]
    severity: error
  - rule: not_null
    columns: [id, id_produto, id_loja, data, quantidade]
    severity: error
  - rule: referential_integrity
    column: id_produto
    references: produto.id
    severity: warning
  - rule: referential_integrity
    column: id_loja
    references: loja.id
    severity: warning
