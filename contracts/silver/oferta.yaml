table: varejinho.silver.oferta
owner: zara.louise
description: Ofertas ativas e futuras - full load diario, inclui datas futuras
sla_freshness_hours: 24
grain: [id]

columns:
  - {name: id,          type: bigint,        nullable: false, unique: true}
  - {name: id_produto,  type: int,           nullable: false}
  - {name: id_loja,     type: int,           nullable: false}
  - {name: datainicio,  type: timestamp,     nullable: false}
  - {name: datatermino, type: timestamp,     nullable: false}
  - {name: preco,       type: decimal(14,2), nullable: false, min: 0}

quality_rules:
  - {rule: no_duplicates, key: [id],                                                            severity: error}
  - {rule: not_null,      columns: [id, id_produto, id_loja, datainicio, datatermino, preco],   severity: error}
  - {rule: referential_integrity, column: id_produto, references: varejinho.silver.produto.id, severity: warning}
  - {rule: referential_integrity, column: id_loja,    references: varejinho.silver.loja.id,    severity: warning}