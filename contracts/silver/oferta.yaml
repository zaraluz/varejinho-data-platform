table: oferta
owner: zara.louise
description: Ofertas ativas e futuras - full load diario, inclui datas futuras
sla_freshness_hours: 24
grain:
  - id

columns:
  - name: id
    type: string
    nullable: false
    unique: true
  - name: id_produto
    type: string
    nullable: false
  - name: id_loja
    type: string
    nullable: false
  - name: datainicio
    type: timestamp
    nullable: false
  - name: datatermino
    type: string
    nullable: false

quality_rules:
  - rule: no_duplicates
    key: [id]
    severity: error
  - rule: not_null
    columns: [id, id_produto, id_loja, datainicio, datatermino]
    severity: error
  - rule: referential_integrity
    column: id_produto
    references: produto.id
    severity: warning
  - rule: referential_integrity
    column: id_loja
    references: loja.id
    severity: warning
