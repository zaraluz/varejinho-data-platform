table: varejinho_silver.logestoque
owner: zara.louise
description: Log de movimentacoes de estoque por produto e loja
sla_freshness_hours: 8
grain: [id]

columns:
  - {name: id,              type: bigint,        nullable: false, unique: true}
  - {name: id_produto,      type: int,           nullable: false}
  - {name: id_loja,         type: int,           nullable: false}
  - {name: datamovimento,   type: timestamp,     nullable: false}
  - {name: quantidade,      type: decimal(14,3), nullable: false}
  - {name: id_tipomovimentacao, type: int,       nullable: false}

quality_rules:
  - {rule: no_duplicates, key: [id],                                                            severity: error}
  - {rule: not_null,      columns: [id, id_produto, id_loja, datamovimento, quantidade],        severity: error}
  - {rule: referential_integrity, column: id_produto, references: varejinho_silver.produto.id, severity: warning}
  - {rule: referential_integrity, column: id_loja,    references: varejinho_silver.loja.id,    severity: warning}