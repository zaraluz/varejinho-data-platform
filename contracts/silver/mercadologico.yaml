table: mercadologico
owner: zara.louise
description: Hierarquia mercadologica com historico SCD Tipo 2
grain:
  - id
  - valid_from

columns:
  - name: id
    type: string
    nullable: false
  - name: valid_from
    type: timestamp
    nullable: false
  - name: valid_to
    type: timestamp
    nullable: true
  - name: is_current
    type: boolean
    nullable: false
  - name: hash_versao
    type: string
    nullable: false

quality_rules:
  - rule: no_duplicates
    key: [id, valid_from]
    severity: error
  - rule: not_null
    columns: [id, valid_from, is_current, hash_versao]
    severity: error
