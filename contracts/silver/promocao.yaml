table: varejinho.silver.promocao
owner: zara.louise
description: Promocoes ativas e futuras - full load diario, inclui datas futuras
sla_freshness_hours: 24
grain: [id]

columns:
  - {name: id,           type: bigint,        nullable: false, unique: true}
  - {name: id_loja,      type: int,           nullable: false}
  - {name: descricao,    type: string,        nullable: false}
  - {name: datainicio,   type: timestamp,     nullable: false}
  - {name: datatermino,  type: timestamp,     nullable: false}
  - {name: valor,        type: decimal(14,2), nullable: true}

quality_rules:
  - {rule: no_duplicates, key: [id],                               severity: error}
  - {rule: not_null,      columns: [id, id_loja, datainicio, datatermino], severity: error}
  - {rule: referential_integrity, column: id_loja, references: varejinho.silver.loja.id, severity: warning}