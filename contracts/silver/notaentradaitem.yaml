table: varejinho.silver.notaentradaitem
owner: zara.louise
description: Itens de notas fiscais de entrada, filtrados via notaentrada
sla_freshness_hours: 8
grain: [id]

columns:
  - {name: id,              type: bigint,        nullable: false, unique: true}
  - {name: id_notaentrada,  type: bigint,        nullable: false}
  - {name: id_produto,      type: int,           nullable: false}
  - {name: quantidade,      type: decimal(14,3), nullable: false}
  - {name: valor,           type: decimal(14,2), nullable: false}

quality_rules:
  - {rule: no_duplicates, key: [id],                                                         severity: error}
  - {rule: not_null,      columns: [id, id_notaentrada, id_produto, quantidade],             severity: error}
  - {rule: referential_integrity, column: id_produto, references: varejinho.silver.produto.id, severity: warning}