# pipeline/bundle.yml
bundle:
  name: varejinho-data-platform

variables:
  catalog:
    default: varejinho

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: varejinho_dev
  prod:
    mode: production
    variables:
      catalog: varejinho

resources:
  jobs:

    pipeline_diario:
      name: "[${bundle.target}] Varejinho — Pipeline Diário"

      schedule:
        quartz_cron_expression: "0 0 7,13,21 * * ?"
        timezone_id: "America/Fortaleza"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - zara.louise@grupovarejinho.com.br

      max_concurrent_runs: 1

      environments:
        - environment_key: serverless
          spec:
            client: "1"

      tasks:
        - task_key: bronze_quality_gate
          environment_key: serverless
          notebook_task:
            notebook_path: /Workspace/Users/zarallouise@gmail.com/varejinho-data-platform/pipeline/bronze/quality_gate.py
          description: "Valida Bronze antes de processar Silver"

        - task_key: silver_scd2
          environment_key: serverless
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: /Workspace/Users/zarallouise@gmail.com/varejinho-data-platform/pipeline/silver/silver_scd2.py
          description: "SCD2 dimensões + SCD1 domínios + curvaabc snapshot"

        - task_key: silver_fatos
          environment_key: serverless
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: /Workspace/Users/zarallouise@gmail.com/varejinho-data-platform/pipeline/silver/transform_fatos.py
          description: "Fatos transacionais e financeiros"

        - task_key: gold_dimensoes
          environment_key: serverless
          depends_on:
            - task_key: silver_scd2
          notebook_task:
            notebook_path: /Workspace/Users/zarallouise@gmail.com/varejinho-data-platform/pipeline/gold/gold_dimensoes.py
          description: "Dimensões da Gold"

        - task_key: gold_fatos
          environment_key: serverless
          depends_on:
            - task_key: silver_fatos
            - task_key: gold_dimensoes
          notebook_task:
            notebook_path: /Workspace/Users/zarallouise@gmail.com/varejinho-data-platform/pipeline/gold/gold_fatos.py
          description: "Fatos da Gold"

        - task_key: gold_quality_gate
          environment_key: serverless
          depends_on:
            - task_key: gold_fatos
          notebook_task:
            notebook_path: /Workspace/Users/zarallouise@gmail.com/varejinho-data-platform/pipeline/gold/quality_gate.py
          description: "35 checks — falha bloqueia e envia alerta"

    manutencao_semanal:
      name: "[${bundle.target}] Varejinho — Manutenção Semanal"

      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"
        timezone_id: "America/Fortaleza"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - zara.louise@grupovarejinho.com.br

      max_concurrent_runs: 1

      environments:
        - environment_key: serverless
          spec:
            client: "1"

      tasks:
        - task_key: optimize_vacuum
          environment_key: serverless
          notebook_task:
            notebook_path: /Workspace/Users/zarallouise@gmail.com/varejinho-data-platform/pipeline/gold/optimize_vacuum.py
          description: "OPTIMIZE + ZORDER + VACUUM em todas as tabelas Gold"