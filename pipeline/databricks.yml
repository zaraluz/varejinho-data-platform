# pipeline/databricks.yml
bundle:
  name: varejinho-data-platform

variables:
  catalog:
    default: varejinho

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: varejinho_dev
  prod:
    mode: production
    variables:
      catalog: varejinho

resources:
  jobs:

    pipeline_diario:
      name: "[${bundle.target}] Varejinho — Pipeline Diário"
      schedule:
        quartz_cron_expression: "0 0 7,13,21 * * ?"
        timezone_id: "America/Fortaleza"
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - <ALERT_EMAIL>
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/bronze/quality_gate.py
          description: "Valida Bronze antes de processar Silver"

        - task_key: silver_dimensions
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/silver/transform_dimensions.py
          description: "SCD2 dimensões + SCD1 domínios + curvaabc snapshot"

        - task_key: silver_sales
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/silver/transform_sales.py
          description: "Processa silver.venda com cast, contrato e schema drift"

        - task_key: silver_facts
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/silver/transform_facts.py
          description: "Fatos transacionais e financeiros"

        - task_key: silver_quality_gate
          depends_on:
            - task_key: silver_dimensions
            - task_key: silver_sales
            - task_key: silver_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/silver/quality_gate.py
          description: "Valida Silver antes de construir Gold"

        - task_key: gold_dimensions
          depends_on:
            - task_key: silver_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/gold/build_dimensions.py
          description: "Dimensões da Gold"

        - task_key: gold_facts
          depends_on:
            - task_key: silver_quality_gate
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: ${workspace.file_path}/gold/build_facts.py
          description: "Fatos da Gold"

        - task_key: gold_quality_gate
          depends_on:
            - task_key: gold_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/gold/quality_gate.py
          description: "35 checks — falha bloqueia e envia alerta"

    manutencao_semanal:
      name: "[${bundle.target}] Varejinho — Manutenção Semanal"
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"
        timezone_id: "America/Fortaleza"
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - <ALERT_EMAIL>
      max_concurrent_runs: 1
      tasks:
        - task_key: optimize_vacuum
          notebook_task:
            notebook_path: ${workspace.file_path}/gold/optimize.py
          description: "OPTIMIZE + ZORDER + VACUUM em todas as tabelas Gold"

    dbt_tests:
      name: "[${bundle.target}] Varejinho — dbt Tests"
      schedule:
        quartz_cron_expression: "0 0 8,14,22 * * ?"
        timezone_id: "America/Fortaleza"
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - <ALERT_EMAIL>
      max_concurrent_runs: 1
      git_source:
        git_url: https://github.com/zaraluz/varejinho-data-platform.git
        git_provider: gitHub
        git_branch: ${bundle.git.branch}
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "4"
            dependencies:
              - "dbt-databricks>=1.8.0,<2.0.0"
      tasks:
        - task_key: dbt_test
          environment_key: dbt_env
          dbt_task:
            source: GIT
            project_directory: dbt
            commands:
              - dbt test
            warehouse_id: cefc7bd879453309
            catalog: varejinho
            schema: gold
          description: "dbt test — 7 testes singulares da Gold"
