# pipeline/databricks.yml
bundle:
  name: varejinho-data-platform

variables:
  catalog:
    description: "Unity Catalog usado pelo target"
    default: varejinho
  bronze_source_catalog:
    description: "Catálogo que expõe a Bronze raw compartilhada"
    default: varejinho
  control_root:
    description: "Raiz dos artefatos de controle do ambiente"
    default: s3://varejinho-lake/_control

# O databricks.yml vive em pipeline/, mas a execução também precisa de
# contracts/ e quality/. Ao sincronizar caminhos acima do bundle root,
# o CLI preserva a estrutura do repositório no workspace.
sync:
  paths:
    - .
    - ../contracts
    - ../quality

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: varejinho_dev
      bronze_source_catalog: varejinho
      control_root: s3://varejinho-lake/_control/dev

  prod:
    mode: production
    variables:
      catalog: varejinho
      bronze_source_catalog: varejinho
      control_root: s3://varejinho-lake/_control
    resources:
      jobs:
        pipeline_diario:
          schedule:
            pause_status: UNPAUSED
        manutencao_semanal:
          schedule:
            pause_status: UNPAUSED
        dbt_tests:
          schedule:
            pause_status: UNPAUSED

resources:
  jobs:

    bootstrap_environment:
      name: "[${bundle.target}] Varejinho — Bootstrap Ambiente"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_source_catalog
          default: ${var.bronze_source_catalog}
      tasks:
        - task_key: register_bronze
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/bronze/ingest_bronze.py
          description: "Cria catálogo/schemas; prod registra Bronze external, dev cria views read-only sobre a Bronze raw"

        - task_key: validate_isolation
          depends_on:
            - task_key: register_bronze
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/bootstrap/validate_environment.py
          description: "Prova que Bronze dev referencia o raw e que escritas Silver permanecem isoladas"

    scd2_profile:
      name: "[${bundle.target}] Varejinho — Gate B SCD2 Profiling"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: profile_scd2_sources
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/profile_scd2.py
          description: "Diagnóstico read-only dos snapshots Bronze antes de reconstruir SCD2"

    scd2_change_profile:
      name: "[${bundle.target}] Varejinho — Gate B2 Change Attribution"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: profile_product_changes
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/profile_scd2_changes.py
          description: "Atribui as mudanças observadas de produto aos atributos e compara dataalteracao x ingestion_date"

    scd2_product_build:
      name: "[${bundle.target}] Varejinho — Gate B3/B4 Product SCD2"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: rebuild_product_history
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/build_scd2_product.py
          description: "Reconstrói produto SCD2 a partir dos snapshots Bronze usando a política Type 1/Type 2 aprovada"

        - task_key: validate_product_history
          depends_on:
            - task_key: rebuild_product_history
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_product.py
          description: "Valida cardinalidade, corrente única, intervalos, hash, Type 1 e estado current"

    scd2_product_incremental:
      name: "[${bundle.target}] Varejinho — Gate B5 Product SCD2 Incremental"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: apply_incremental_product_scd2
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2_product.py
          description: "Processa somente snapshots Bronze posteriores ao watermark committed; Type 2 fecha/insere, Type 1 atualiza sem versionar"

        - task_key: validate_incremental_product_scd2
          depends_on:
            - task_key: apply_incremental_product_scd2
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_product.py
          description: "Revalida todos os invariantes SCD2 antes de promover o watermark"

        - task_key: commit_product_watermark
          depends_on:
            - task_key: validate_incremental_product_scd2
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/commit_scd2_product_watermark.py
          description: "Promove candidate_snapshot para last_processed_snapshot somente após o Quality Gate passar"

    pipeline_diario:
      name: "[${bundle.target}] Varejinho — Pipeline Diário"
      # Dev fica PAUSED por padrão. Somente prod é liberado no override acima.
      schedule:
        quartz_cron_expression: "0 0 7,13,21 * * ?"
        timezone_id: "America/Fortaleza"
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - zara.louise@grupovarejinho.com.br
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bundle_files_path
          default: ${workspace.file_path}
        - name: control_root
          default: ${var.control_root}
      tasks:
        - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/bronze/quality_gate.py
          description: "Valida Bronze antes de processar Silver"

        - task_key: silver_dimensions
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/transform_dimensions.py
          description: "SCD2 dimensões + SCD1 domínios + curvaabc snapshot"

        - task_key: silver_sales
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/transform_sales.py
          description: "Processa silver.venda com cast, contrato e schema drift"

        - task_key: silver_facts
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/transform_facts.py
          description: "Fatos transacionais e financeiros"

        - task_key: silver_quality_gate
          depends_on:
            - task_key: silver_dimensions
            - task_key: silver_sales
            - task_key: silver_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/quality_gate.py
          description: "Valida Silver antes de construir Gold"

        - task_key: gold_dimensions
          depends_on:
            - task_key: silver_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/build_dimensions.py
          description: "Dimensões da Gold"

        - task_key: gold_facts
          depends_on:
            - task_key: silver_quality_gate
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/build_facts.py
          description: "Fatos da Gold"

        - task_key: gold_quality_gate
          depends_on:
            - task_key: gold_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/quality_gate.py
          description: "Quality Gate da Gold — falha bloqueia e envia alerta"

    manutencao_semanal:
      name: "[${bundle.target}] Varejinho — Manutenção Semanal"
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"
        timezone_id: "America/Fortaleza"
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - zara.louise@grupovarejinho.com.br
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: optimize_vacuum
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/optimize.py
          description: "OPTIMIZE + ZORDER + VACUUM em todas as tabelas Gold"

    dbt_tests:
      name: "[${bundle.target}] Varejinho — dbt Tests"
      schedule:
        quartz_cron_expression: "0 0 8,14,22 * * ?"
        timezone_id: "America/Fortaleza"
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - zara.louise@grupovarejinho.com.br
      max_concurrent_runs: 1
      git_source:
        git_url: https://github.com/zaraluz/varejinho-data-platform.git
        git_provider: gitHub
        git_branch: ${bundle.git.branch}
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "4"
            dependencies:
              - "dbt-databricks>=1.8.0,<2.0.0"
      tasks:
        - task_key: dbt_test
          environment_key: dbt_env
          dbt_task:
            source: GIT
            project_directory: dbt
            commands:
              - dbt test
            warehouse_id: cefc7bd879453309
            catalog: ${var.catalog}
            schema: gold
          description: "dbt test — testes da Gold"
