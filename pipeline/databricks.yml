bundle:
  name: varejinho-data-platform

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo Unity Catalog de destino
    default: varejinho_dev
  bronze_source_catalog:
    description: Catálogo que possui a Bronze física
    default: varejinho
  control_root:
    description: Prefixo de controle por ambiente
    default: s3://varejinho-lake/_control/dev

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: varejinho_dev
      bronze_source_catalog: varejinho
      control_root: s3://varejinho-lake/_control/dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: varejinho
      bronze_source_catalog: varejinho
      control_root: s3://varejinho-lake/_control/prod
    resources:
      jobs:
        pipeline_diario:
          schedule:
            pause_status: PAUSED
        manutencao_semanal:
          schedule:
            pause_status: PAUSED
        dbt_tests:
          schedule:
            pause_status: PAUSED

resources:
  jobs:
    gold_temporal_profile:
      name: "[${bundle.target}] Varejinho — Gate G1 Temporal Profile"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: profile_temporal_semantics
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/profile_temporal_semantics.py
          description: "Compara current join vs temporal join em fatos Gold sem alterar dados"

    gold_temporal_boundary_profile:
      name: "[${bundle.target}] Varejinho — Gate G2 Temporal Boundary Profile"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: profile_temporal_boundaries
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/profile_temporal_boundaries.py
          description: "Perfila eventos before-first e boundaries SCD2 sem alterar dados"

    gold_temporal_apply:
      name: "[${bundle.target}] Varejinho — Gold Temporal Apply"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bundle_files_path
          default: ${workspace.file_path}
      tasks:
        - task_key: guard_dev_only
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/guard_temporal_apply.py
          description: "Bloqueia execução fora de catálogo *_dev durante hardening"

        - task_key: rebuild_gold_dimensions
          depends_on:
            - task_key: guard_dev_only
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/build_dimensions.py
          description: "Recria somente as dimensões Gold a partir da Silver SCD2 já aprovada"

        - task_key: rebuild_gold_facts
          depends_on:
            - task_key: rebuild_gold_dimensions
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/build_facts.py
          description: "Recria os fatos Gold com os joins temporais aprovados"

        - task_key: validate_gold_temporal
          depends_on:
            - task_key: rebuild_gold_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/quality_gate.py
          description: "Valida SKs temporais, overlaps, unresolved explicados e invariantes Gold"

    contract_profile:
      name: "[${bundle.target}] Varejinho — Gate C1 Data Contracts Profile"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bundle_files_path
          default: ${workspace.file_path}
      tasks:
        - task_key: profile_contracts
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/profile_contracts.py
          description: "Inventário/lint read-only dos contratos Silver, criticidade, schema real, hardcodes e gaps de enforcement"

    contract_engine_fixture:
      name: "[${bundle.target}] Varejinho — Gate C3 Contract Engine Fixture"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bundle_files_path
          default: ${workspace.file_path}
      tasks:
        - task_key: fixture_contract_engine
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/fixture_contract_engine.py
          description: "Prova PASS/QUARANTINE/WARNING/FAIL do engine canônico sem integrar o runtime"

    pipeline_diario:
      name: "[${bundle.target}] Varejinho — Pipeline Diário"
      # Schedules ficam PAUSED durante hardening; o Release Gate decide quando liberar prod.
      schedule:
        quartz_cron_expression: "0 0 7,13,21 * * ?"
        timezone_id: "America/Fortaleza"
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - <ALERT_EMAIL>
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bundle_files_path
          default: ${workspace.file_path}
        - name: control_root
          default: ${var.control_root}
        - name: bronze_source_catalog
          default: ${var.bronze_source_catalog}
      tasks:
        - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/bronze/quality_gate.py
          description: "Valida Bronze antes de processar Silver"

        - task_key: silver_reference_dimensions
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/transform_reference_dimensions.py
          description: "Processa somente SCD1/domínios + curvaabc; nunca toca produto/fornecedor/mercadologico"

        - task_key: product_scd2_apply
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2.py
            base_parameters:
              entity: produto
          description: "Aplica incremental SCD2 de produto"

        - task_key: product_scd2_validate
          depends_on:
            - task_key: product_scd2_apply
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_candidate.py
            base_parameters:
              entity: produto
          description: "Valida candidate SCD2 de produto"

        - task_key: product_scd2_commit
          depends_on:
            - task_key: product_scd2_validate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/commit_scd2_candidate.py
            base_parameters:
              entity: produto
          description: "Promove candidate SCD2 de produto"

        - task_key: supplier_scd2_apply
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2.py
            base_parameters:
              entity: fornecedor
          description: "Aplica incremental SCD2 de fornecedor"

        - task_key: supplier_scd2_validate
          depends_on:
            - task_key: supplier_scd2_apply
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_candidate.py
            base_parameters:
              entity: fornecedor
          description: "Valida candidate SCD2 de fornecedor"

        - task_key: supplier_scd2_commit
          depends_on:
            - task_key: supplier_scd2_validate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/commit_scd2_candidate.py
            base_parameters:
              entity: fornecedor
          description: "Promove candidate SCD2 de fornecedor"

        - task_key: merchandise_scd2_apply
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2.py
            base_parameters:
              entity: mercadologico
          description: "Aplica incremental SCD2 de mercadologico"

        - task_key: merchandise_scd2_validate
          depends_on:
            - task_key: merchandise_scd2_apply
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_candidate.py
            base_parameters:
              entity: mercadologico
          description: "Valida candidate SCD2 de mercadologico"

        - task_key: merchandise_scd2_commit
          depends_on:
            - task_key: merchandise_scd2_validate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/commit_scd2_candidate.py
            base_parameters:
              entity: mercadologico
          description: "Promove candidate SCD2 de mercadologico"

        - task_key: silver_sales_apply
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/incremental_sales.py
          description: "Aplica incremental D+1 de venda"

        - task_key: silver_sales_validate
          depends_on:
            - task_key: silver_sales_apply
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/validate_fact_candidate.py
            base_parameters:
              entity: venda
          description: "Valida candidate de venda"

        - task_key: silver_sales_commit
          depends_on:
            - task_key: silver_sales_validate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/commit_fact_candidate.py
            base_parameters:
              entity: venda
          description: "Promove candidate de venda"

        - task_key: silver_facts_apply
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/incremental_facts.py
            base_parameters:
              entity: all
          description: "Aplica incremental D+1 dos 13 facts restantes"

        - task_key: silver_facts_validate
          depends_on:
            - task_key: silver_facts_apply
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/validate_fact_candidate.py
            base_parameters:
              entity: all
          description: "Valida candidates dos 13 facts"

        - task_key: silver_facts_commit
          depends_on:
            - task_key: silver_facts_validate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/commit_fact_candidate.py
            base_parameters:
              entity: all
          description: "Promove candidates dos 13 facts"

        - task_key: silver_quality_gate
          depends_on:
            - task_key: product_scd2_commit
            - task_key: supplier_scd2_commit
            - task_key: merchandise_scd2_commit
            - task_key: silver_sales_commit
            - task_key: silver_facts_commit
            - task_key: silver_reference_dimensions
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/quality_gate.py
          description: "Gate final Silver antes da Gold"

        - task_key: gold_dimensions
          depends_on:
            - task_key: silver_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/build_dimensions.py
          description: "Constrói dimensões Gold"

        - task_key: gold_facts
          depends_on:
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/build_facts.py
          description: "Constrói fatos Gold"

        - task_key: gold_quality_gate
          depends_on:
            - task_key: gold_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/gold/quality_gate.py
          description: "Gate final Gold"

    manutencao_semanal:
      name: "[${bundle.target}] Varejinho — Manutenção Semanal"
      schedule:
        quartz_cron_expression: "0 0 4 ? * SUN"
        timezone_id: "America/Fortaleza"
        pause_status: PAUSED
      tasks:
        - task_key: vacuum_optimize
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/maintenance/vacuum_optimize.py

    dbt_tests:
      name: "[${bundle.target}] Varejinho — dbt Tests"
      schedule:
        quartz_cron_expression: "0 30 8 * * ?"
        timezone_id: "America/Fortaleza"
        pause_status: PAUSED
      tasks:
        - task_key: dbt_test
          dbt_task:
            project_directory: ${workspace.file_path}/dbt
            commands:
              - dbt deps --target ${bundle.target}
              - dbt test --target ${bundle.target}
