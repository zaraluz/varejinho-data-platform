# pipeline/databricks.yml
# Raiz do bundle: identidade, variáveis, sync e targets.
#
# Os jobs vivem em resources/:
#   resources/*.yml      -> jobs de produção (pipeline_diario, manutencao_semanal, dbt_tests),
#                           deployados em dev e em prod
#   resources/dev/*.yml  -> jobs de operação (ops/) e de prova (validation/), declarados
#                           somente em targets.dev: nunca existem em prod
bundle:
  name: varejinho-data-platform

# Variáveis de ambiente SEM default: cada target precisa declarar as suas.
# Um target novo esquecido falha no `bundle validate` em vez de herdar prod.
variables:
  catalog:
    description: "Unity Catalog usado pelo target"
  bronze_source_catalog:
    description: "Catálogo que expõe a Bronze raw compartilhada"
  control_root:
    description: "Raiz dos artefatos de controle do ambiente"
  alert_email:
    description: >-
      Destino dos alertas de falha dos jobs. Sem default e fora do Git:
      definir em .databricks/bundle/<target>/variable-overrides.json
      (gitignored) ou na variável de ambiente BUNDLE_VAR_alert_email.
  warehouse_id:
    description: "SQL warehouse usado pela task dbt, resolvido pelo nome no deploy"
    lookup:
      warehouse: "Serverless Starter Warehouse"

# O databricks.yml vive em pipeline/, mas a execução também precisa de
# contracts/ e quality/. Ao sincronizar caminhos acima do bundle root,
# o CLI preserva a estrutura do repositório no workspace.
sync:
  paths:
    - .
    - ../contracts
    - ../quality
    - ../ops
    - ../validation

include:
  - resources/*.yml
  - resources/dev/*.yml

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: varejinho_dev
      bronze_source_catalog: varejinho
      control_root: s3://varejinho-lake/_control/dev

  prod:
    mode: production
    # Arquivos de prod ficam em /Workspace/Shared, não na pasta pessoal de quem
    # fez o deploy: o service principal precisa ler os notebooks para executá-los.
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    # Jobs de prod executam como identidade de máquina (menor privilégio,
    # independente da conta pessoal). Quem faz o deploy continua sendo a autora.
    run_as:
      service_principal_name: bf71079b-64e1-4763-8b86-1e90718d8864  # sp-varejinho-pipeline-prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    variables:
      catalog: varejinho
      bronze_source_catalog: varejinho
      control_root: s3://varejinho-lake/_control
    resources:
      jobs:
        pipeline_diario:
          schedule:
            pause_status: PAUSED
        manutencao_semanal:
          schedule:
            pause_status: PAUSED
        dbt_tests:
          schedule:
            pause_status: PAUSED
