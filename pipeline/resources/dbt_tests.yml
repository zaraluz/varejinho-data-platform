# pipeline/resources/dbt_tests.yml — job de produção (deployado em dev e prod).

resources:
  jobs:
    dbt_tests:
      name: "[${bundle.target}] Varejinho — dbt Tests"
      tags:
        purpose: production
      schedule:
        quartz_cron_expression: "0 0 8,14,22 * * ?"
        timezone_id: "America/Fortaleza"
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - <ALERT_EMAIL>
      max_concurrent_runs: 1
      git_source:
        git_url: https://github.com/zaraluz/varejinho-data-platform.git
        git_provider: gitHub
        git_branch: ${bundle.git.branch}
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "4"
            dependencies:
              - "dbt-databricks>=1.8.0,<2.0.0"
      tasks:
        - task_key: dbt_test
          environment_key: dbt_env
          dbt_task:
            source: GIT
            project_directory: dbt
            commands:
              - dbt test
            warehouse_id: cefc7bd879453309
            catalog: ${var.catalog}
            schema: gold
          description: "dbt test — testes da Gold"
