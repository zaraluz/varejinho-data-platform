# pipeline/resources/pipeline_diario.yml — job de produção (deployado em dev e prod).

resources:
  jobs:
    pipeline_diario:
      name: "[${bundle.target}] Varejinho — Pipeline Diário"
      tags:
        purpose: production
      # Uma execução por dia: a Silver só processa partições maduras (D+1) e o
      # Pentaho fecha a partição do dia D por volta de 01:00 de D+1. Rodar mais
      # vezes por dia seria no-op nas facts. Schedule nasce PAUSED; o Release Gate
      # decide a ativação.
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: "America/Fortaleza"
        pause_status: PAUSED
      # Run medido em 23/09: ~40 min (~25 min de espera da plataforma serverless).
      # Aviso de duração em 1h; corte duro em 2h para um run travado não ficar
      # rodando indefinidamente nem bloquear o próximo (max_concurrent_runs: 1).
      timeout_seconds: 7200
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600
      email_notifications:
        on_failure:
          - ${var.alert_email}
        on_duration_warning_threshold_exceeded:
          - ${var.alert_email}
      max_concurrent_runs: 1
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "4"
            dependencies:
              - "dbt-databricks>=1.8.0,<2.0.0"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bundle_files_path
          default: ${workspace.file_path}
        - name: control_root
          default: ${var.control_root}
        - name: bronze_source_catalog
          default: ${var.bronze_source_catalog}
      tasks:
        - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/bronze/quality_gate.py
          description: "Valida Bronze antes de processar Silver"

        - task_key: silver_reference_dimensions
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/transform_reference_dimensions.py
          description: "Processa somente SCD1/domínios + curvaabc; nunca toca produto/fornecedor/mercadologico"

        - task_key: product_scd2_apply
          depends_on:
            - task_key: bronze_quality_gate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2.py
            base_parameters:
              entity: produto
          description: "Aplica incremental SCD2 de produto"

        - task_key: product_scd2_validate
          depends_on:
            - task_key: product_scd2_apply
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_product.py
          description: "Quality Gate SCD2 produto"

        - task_key: product_scd2_commit
          depends_on:
            - task_key: product_scd2_validate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/commit_scd2_watermark.py
            base_parameters:
              entity: produto
          description: "Promove watermark de produto após validação"

        # As três entidades compartilham control.scd2_watermark.
        # Serializar evita writes concorrentes na tabela de controle.
        - task_key: supplier_scd2_apply
          depends_on:
            - task_key: product_scd2_commit
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2.py
            base_parameters:
              entity: fornecedor
          description: "Aplica incremental SCD2 curado de fornecedor"

        - task_key: supplier_scd2_validate
          depends_on:
            - task_key: supplier_scd2_apply
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_supplier.py
          description: "Quality Gate SCD2 fornecedor + data minimization"

        - task_key: supplier_scd2_commit
          depends_on:
            - task_key: supplier_scd2_validate
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/commit_scd2_watermark.py
            base_parameters:
              entity: fornecedor
          description: "Promove watermark de fornecedor após validação"

        - task_key: mercadologico_scd2_apply
          depends_on:
            - task_key: supplier_scd2_commit
          notebook_task:
            notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2.py
