# pipeline/resources/dev/ops.yml — operações one-off e destrutivas (bootstrap, backfill, seed, repair, catch-up real).

# Declarado somente em targets.dev: estes jobs NUNCA são deployados em prod.

targets:
  dev:
    resources:
      jobs:
        partition_manifest_bootstrap:
          name: "[${bundle.target}] Varejinho — Gate R2 Partition Manifest Bootstrap"
          tags:
            purpose: ops
            block: release
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
            - name: bronze_source_catalog
              default: ${var.bronze_source_catalog}
            - name: bundle_files_path
              default: ${workspace.file_path}
            - name: control_root
              default: ${var.control_root}
          tasks:
            - task_key: bootstrap_fact_partition_manifests
              notebook_task:
                notebook_path: ${workspace.file_path}/ops/seed/bootstrap_fact_partition_manifests.py
              description: "Bootstrap explícito dos manifests das 14 facts até o watermark committed atual"

        bootstrap_environment:
          name: "[${bundle.target}] Varejinho — Bootstrap Ambiente"
          tags:
            purpose: ops
            block: environment
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
            - name: bronze_source_catalog
              default: ${var.bronze_source_catalog}
          tasks:
            - task_key: register_bronze
              notebook_task:
                notebook_path: ${workspace.file_path}/ops/bootstrap/ingest_bronze.py
              description: "Cria catálogo/schemas; prod registra Bronze external, dev cria views read-only sobre a Bronze raw"

            - task_key: validate_isolation
              depends_on:
                - task_key: register_bronze
              notebook_task:
                notebook_path: ${workspace.file_path}/ops/bootstrap/validate_environment.py
              description: "Prova que Bronze dev referencia o raw e que escritas Silver permanecem isoladas"

        scd2_supplier_build:
          name: "[${bundle.target}] Varejinho — Gate B7D Supplier SCD2"
          tags:
            purpose: ops
            block: scd2
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
          tasks:
            - task_key: rebuild_supplier_history
              notebook_task:
                notebook_path: ${workspace.file_path}/ops/backfill/build_scd2_supplier.py
              description: "Reconstrói fornecedor SCD2 real em dev após aprovação da fixture"

            - task_key: validate_supplier_history
              depends_on:
                - task_key: rebuild_supplier_history
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_supplier.py
              description: "Valida invariantes do fornecedor SCD2 real"

        scd2_supplier_incremental:
          name: "[${bundle.target}] Varejinho — Gate B7F Supplier SCD2 Incremental"
          tags:
            purpose: ops
            block: scd2
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
          tasks:
            - task_key: apply_incremental_supplier_scd2
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2.py
                base_parameters:
                  entity: fornecedor
              description: "Processa somente snapshots novos de fornecedor com o engine SCD2 reutilizável"

            - task_key: validate_incremental_supplier_scd2
              depends_on:
                - task_key: apply_incremental_supplier_scd2
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_supplier.py
              description: "Revalida os invariantes do fornecedor antes de avançar watermark"

            - task_key: commit_supplier_watermark
              depends_on:
                - task_key: validate_incremental_supplier_scd2
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/commit_scd2_watermark.py
                base_parameters:
                  entity: fornecedor
              description: "Promove candidate para committed somente após Quality Gate"

        scd2_mercadologico_build:
          name: "[${bundle.target}] Varejinho — Gate B8C Mercadologico SCD2"
          tags:
            purpose: ops
            block: scd2
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
          tasks:
            - task_key: rebuild_mercadologico_history
              notebook_task:
                notebook_path: ${workspace.file_path}/ops/backfill/build_scd2_mercadologico.py
              description: "Reconstrói mercadologico com valid_from no primeiro snapshot observado"

            - task_key: validate_mercadologico_history
              depends_on:
                - task_key: rebuild_mercadologico_history
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_mercadologico.py
              description: "Valida invariantes do mercadologico SCD2 real"

        scd2_mercadologico_incremental:
          name: "[${bundle.target}] Varejinho — Mercadologico SCD2 Incremental"
          tags:
            purpose: ops
            block: scd2
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
          tasks:
            - task_key: apply_incremental_mercadologico_scd2
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2.py
                base_parameters:
                  entity: mercadologico
              description: "Processa apenas snapshots novos do mercadologico com first-observed boundaries"

            - task_key: validate_incremental_mercadologico_scd2
              depends_on:
                - task_key: apply_incremental_mercadologico_scd2
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_mercadologico.py
              description: "Valida os 19 invariantes antes de avançar watermark"

            - task_key: commit_mercadologico_watermark
              depends_on:
                - task_key: validate_incremental_mercadologico_scd2
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/commit_scd2_watermark.py
                base_parameters:
                  entity: mercadologico
              description: "Promove candidate somente após Quality Gate"

        scd2_product_build:
          name: "[${bundle.target}] Varejinho — Gate B3/B4 Product SCD2"
          tags:
            purpose: ops
            block: scd2
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
          tasks:
            - task_key: rebuild_product_history
              notebook_task:
                notebook_path: ${workspace.file_path}/ops/backfill/build_scd2_product.py
              description: "Reconstrói produto SCD2 a partir dos snapshots Bronze usando a política Type 1/Type 2 aprovada"

            - task_key: validate_product_history
              depends_on:
                - task_key: rebuild_product_history
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_product.py
              description: "Valida cardinalidade, corrente única, intervalos, hash, Type 1 e estado current"

        scd2_product_incremental:
          name: "[${bundle.target}] Varejinho — Product SCD2 Incremental (Generic Engine)"
          tags:
            purpose: ops
            block: scd2
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
          tasks:
            - task_key: apply_incremental_product_scd2
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/incremental_scd2.py
                base_parameters:
                  entity: produto
              description: "Processa produto com o engine SCD2 compartilhado, preservando a política temporal aprovada"

            - task_key: validate_incremental_product_scd2
              depends_on:
                - task_key: apply_incremental_product_scd2
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/validate_scd2_product.py
              description: "Revalida os 21 invariantes antes de promover o watermark"

            - task_key: commit_product_watermark
              depends_on:
                - task_key: validate_incremental_product_scd2
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/commit_scd2_watermark.py
                base_parameters:
                  entity: produto
              description: "Promove candidate_snapshot somente após o Quality Gate"

        facts_watermark_seed:
          name: "[${bundle.target}] Varejinho — Gate D3 Facts Watermark Seed"
          tags:
            purpose: ops
            block: facts
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
          tasks:
            - task_key: seed_fact_watermarks
              notebook_task:
                notebook_path: ${workspace.file_path}/ops/seed/seed_fact_watermark.py
              description: "Semeia 13 watermarks a partir do maior ingestion_date já comprovadamente materializado na Silver"

        facts_incremental_real:
          name: "[${bundle.target}] Varejinho — Gate D5 Real Facts Incremental Catch-up"
          tags:
            purpose: ops
            block: facts
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ${var.catalog}
            - name: bundle_files_path
              default: ${workspace.file_path}
            - name: control_root
              default: ${var.control_root}
          tasks:
            - task_key: apply_notaentrada
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/incremental_facts.py
                base_parameters:
                  entity: notaentrada
              description: "Aplica snapshots pendentes de notaentrada sem avançar watermark"

            - task_key: validate_notaentrada
              depends_on:
                - task_key: apply_notaentrada
              notebook_task:
                notebook_path: ${workspace.file_path}/validation/facts/validate_incremental_facts.py
                base_parameters:
                  entity: notaentrada
              description: "Prova incremental == full rebuild para notaentrada"

            - task_key: commit_notaentrada
              depends_on:
                - task_key: validate_notaentrada
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/commit_fact_watermark.py
                base_parameters:
                  entity: notaentrada
              description: "Promove watermark de notaentrada somente após equivalência"

            - task_key: apply_notaentradaitem
              depends_on:
                - task_key: commit_notaentrada
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/incremental_facts.py
                base_parameters:
                  entity: notaentradaitem
              description: "Aplica snapshots pendentes de notaentradaitem sem avançar watermark"

            - task_key: validate_notaentradaitem
