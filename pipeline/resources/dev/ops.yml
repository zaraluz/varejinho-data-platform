              description: "Prova incremental == full rebuild para notaentradaitem"

            - task_key: commit_notaentradaitem
              depends_on:
                - task_key: validate_notaentradaitem
              notebook_task:
                notebook_path: ${workspace.file_path}/pipeline/silver/commit_fact_watermark.py
                base_parameters:
                  entity: notaentradaitem
              description: "Promove watermark de notaentradaitem somente após equivalência"

            - task_key: apply_perda
