version: 2

sources:
  - name: gold
    schema: gold
    description: "Gold Star Schema materialized by the Databricks PySpark/SQL pipeline. dbt is a read-only test/documentation consumer of these relations."
    config:
      meta:
        materialized_by: "Databricks PySpark/SQL pipeline"
        dbt_ownership: "external_source"

    tables:
      - name: fato_vendas
        description: "Sales fact — grain: one sold item per transaction/store."
        columns:
          - name: sk_venda
            description: "Fact surrogate key: MD5(source sale id + id_loja)."
            data_tests: [not_null, unique]
          - name: sk_produto
            description: "Temporal FK to dim_produto."
            data_tests: [not_null]
          - name: sk_loja
            description: "Store/CD key (dim_loja uses the store id as its key)."
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2, 3]
          - name: sk_tempo
            description: "Calendar FK in YYYYMMDD integer format."
            data_tests: [not_null]
          - name: valor_total
            data_tests: [not_null]

      - name: fato_compras
        description: "Purchases fact — grain: one purchase-order item."
        columns:
          - name: sk_compra
            data_tests: [not_null, unique]
          - name: sk_fornecedor
            description: "Temporal supplier FK. Current validated state has no unresolved supplier keys."
            data_tests: [not_null]

      - name: fato_perdas
        description: "Losses fact — grain: one loss record."
        columns:
          - name: sk_perda
            data_tests: [not_null, unique]
          - name: sk_produto
            data_tests: [not_null]
          - name: sk_motivo_perda
            description: "FK to dim_motivo_perda."
            data_tests:
              - relationships:
                  arguments:
                    to: source('gold', 'dim_motivo_perda')
                    field: sk_motivo_perda

      - name: fato_movimento_estoque
        description: "Inventory movement fact — grain: one inventory movement."
        columns:
          - name: sk_movimento
            data_tests: [not_null, unique]

      - name: fato_oferta
        description: "Offer fact — grain: one product offer per store."
        columns:
          - name: sk_oferta
            data_tests: [not_null, unique]
          - name: sk_produto
            data_tests: [not_null]
          - name: sk_tipo_oferta
            description: "FK to dim_tipo_oferta."
            data_tests:
              - relationships:
                  arguments:
                    to: source('gold', 'dim_tipo_oferta')
                    field: sk_tipo_oferta

      - name: fato_promocoes
        description: "Promotion fact — grain: one promotion item/store. Header attributes live in dim_promocao."
        columns:
          - name: sk_promocao_item
            data_tests: [not_null, unique]
          - name: sk_promocao
            description: "FK to dim_promocao (promotion header)."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('gold', 'dim_promocao')
                    field: sk_promocao

      - name: fato_contas_pagar
        description: "Accounts payable fact — grain: one supplier-payment installment."
        columns:
          - name: sk_parcela
            data_tests: [not_null, unique]
          - name: sk_tipo_pagamento
            description: "FK to the conformed dim_tipo_pagamento."
            data_tests:
              - relationships:
                  arguments:
                    to: source('gold', 'dim_tipo_pagamento')
                    field: sk_tipo_pagamento

      - name: fato_outras_despesas
        description: "Other operating expenses fact — grain: one expense."
        columns:
          - name: sk_despesa
            data_tests: [not_null, unique]
          - name: sk_tipo_pagamento
            description: "FK to the conformed dim_tipo_pagamento."
            data_tests:
              - relationships:
                  arguments:
                    to: source('gold', 'dim_tipo_pagamento')
                    field: sk_tipo_pagamento
          - name: sk_tipo_entrada
            description: "FK to dim_tipo_entrada."
            data_tests:
              - relationships:
                  arguments:
                    to: source('gold', 'dim_tipo_entrada')
                    field: sk_tipo_entrada

      - name: fato_curva_abc
        description: "ABC curve snapshot fact — grain: product/store/snapshot_date."
        columns:
          - name: sk_curva
            data_tests: [not_null, unique]
          - name: sk_produto
            data_tests: [not_null]

      - name: dim_produto
        description: "Product SCD2 dimension. Merchandise hierarchy names, packaging type and goods type are flattened in."
        columns:
          - name: sk_produto
            data_tests: [not_null, unique]
          - name: id_produto
            data_tests: [not_null]
          - name: is_current
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [true, false]

      - name: dim_fornecedor
        description: "Supplier SCD2 dimension."
        columns:
          - name: sk_fornecedor
            data_tests: [not_null, unique]

      - name: dim_loja
        description: "Store/CD dimension."
        columns:
          - name: sk_loja
            data_tests: [not_null, unique]

      - name: dim_mercadologico
        description: "Merchandising hierarchy SCD2 reference (names are flattened into dim_produto; this table also keeps subgroups without products)."
        columns:
          - name: sk_mercadologico
            data_tests: [not_null, unique]

      - name: dim_tempo
        description: "Calendar dimension generated by code for 2023-01-01 through 2027-12-31."
        columns:
          - name: sk_tempo
            data_tests: [not_null, unique]

      - name: dim_tipo_pagamento
        description: "Conformed payment-type dimension shared by fato_contas_pagar and fato_outras_despesas."
        columns:
          - name: sk_tipo_pagamento
            data_tests: [not_null, unique]

      - name: dim_tipo_entrada
        description: "Entry-type dimension for fato_outras_despesas."
        columns:
          - name: sk_tipo_entrada
            data_tests: [not_null, unique]

      - name: dim_motivo_perda
        description: "Loss-reason dimension for fato_perdas."
        columns:
          - name: sk_motivo_perda
            data_tests: [not_null, unique]

      - name: dim_tipo_oferta
        description: "Offer-type dimension for fato_oferta."
        columns:
          - name: sk_tipo_oferta
            data_tests: [not_null, unique]

      - name: dim_promocao
        description: "Promotion header dimension (description, type, status, dates, value, discount, minimum quantity)."
        columns:
          - name: sk_promocao
            data_tests: [not_null, unique]
